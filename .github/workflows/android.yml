name: Android

# Builds a debug APK of the Capacitor app so every change to main can be
# installed on a phone without a local Android SDK. Release/AAB signing is
# done locally (see docs/MOBILE.md) until store credentials exist.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "src/**"
      - "public/**"
      - "package*.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: gardener-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
