# nginx replaces inherited add_header directives as soon as a nested block sets
# one of its own, so every location that adds a header must re-include these.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://openweathermap.org; font-src 'self'; connect-src 'self' https://api.open-meteo.com https://api.openweathermap.org https://geocoding-api.open-meteo.com; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
